# /etc/nginx/sites-available/eden-store
# Nginx recibe las peticiones en el puerto 80 y las pasa a Gunicorn (127.0.0.1:8000).
server {
    listen 80;
    listen [::]:80;
    server_name _;            # Cambiar por su dominio si tiene uno

    client_max_body_size 5M;

    access_log /var/log/nginx/eden-store.access.log;
    error_log  /var/log/nginx/eden-store.error.log;

    # Archivos estáticos (CSS) los sirve Nginx directamente
    location /static/ {
        alias /opt/eden-store/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
